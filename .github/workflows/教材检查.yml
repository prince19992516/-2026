name: 教材检查与构建

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: textbook-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: notebook-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 环境/requirements.txt
      - run: python -m pip install -r 环境/requirements.txt
      - run: python -m pip check
      - run: python -m ipykernel install --sys-prefix --name python3 --display-name "Python 3 (course-2026)"
      - run: python -m unittest discover -s 脚本 -p "test_*.py"
      - run: python 脚本/检查结构.py
      - run: python 脚本/验证AI陷阱.py
      - run: python 脚本/检查笔记本.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notebook-results-${{ matrix.os }}
          path: _build/executed
          if-no-files-found: warn
  book:
    name: build-book
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 环境/requirements.txt
      - run: python -m pip install -r 环境/requirements.txt
      - run: python -m ipykernel install --sys-prefix --name python3
      - run: python 脚本/构建教材.py
      - uses: actions/upload-artifact@v4
        with:
          name: textbook-html
          path: 教材/_build/html
          if-no-files-found: error
