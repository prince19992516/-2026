name: 教材检查与构建

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: textbook-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: notebook-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 环境/requirements.txt
      - name: Install through the student setup command
        run: python course.py setup
      - name: Test helper and execution failure handling
        run: python -c "import subprocess, course; subprocess.run([str(course.ENV_PYTHON), '-m', 'unittest', 'discover', '-s', '脚本', '-p', 'test_*.py'], check=True)"
      - name: Check through the student command
        run: python course.py check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notebook-results-${{ matrix.os }}
          path: _build/executed
          if-no-files-found: warn
  book:
    name: build-book
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 环境/requirements.txt
      - run: python course.py setup
      - run: python course.py build
      - uses: actions/upload-artifact@v4
        with:
          name: textbook-html
          path: 教材/_build/html
          if-no-files-found: error
