<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640" role="img" aria-labelledby="ttl dsc"><title id="ttl">本章主线：一个动作，五种用法</title><desc id="dsc">本章所有方法共享同一个动作：用一个容易计算的 p 代替难处理的 f，再追问误差 f-p 有多大。五张卡片分别对应插值、逼近、插值积分、插值微分、网络逼近与求导，各自给出定 p 的方式、用途与误差形态。第三、四站构成一对反向操作：积分把误差平均掉一层而降一阶，微分把误差放大一层而升一阶。概念示意，不是实测结果。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC","PingFang SC",sans-serif;font-variant-numeric:tabular-nums}</style><rect x="0" y="0" width="1440" height="640" fill="#faf7ef"/><rect x="36" y="28" width="94" height="34" rx="17" fill="#193b42"/><text x="83" y="52" font-size="17" fill="#ffffff" font-weight="650" text-anchor="middle">CH 02</text><text x="149" y="54" font-size="24" fill="#193b42" font-weight="650" text-anchor="start">逼近的智慧</text><text x="38" y="112" font-size="34" fill="#193b42" font-weight="700" text-anchor="start">一个动作，五种用法</text><text x="1400" y="112" font-size="18" fill="#607570" font-weight="500" text-anchor="end">概念示意 · 不是实测结果</text><rect x="44" y="140" width="1352" height="92" rx="12" fill="#eef4ef" stroke="#dbe5e2" stroke-width="2"/><text x="76" y="172" font-size="13" fill="#607570" text-anchor="start">手上只有</text><text x="76" y="200" font-size="19" fill="#193b42" font-weight="650" text-anchor="start">有限个数字</text><text x="196" y="196" font-size="14" fill="#4a5f5b" text-anchor="start">采样值、测点、格点</text><path d="M330 186 L372 186" stroke="#207a68" stroke-width="2.5"/><path d="M372 186 L362 181.5 L362 190.5 Z" fill="#207a68"/><rect x="392" y="152" width="330" height="68" rx="10" fill="#ffffff" stroke="#207a68" stroke-width="2"/><text x="557" y="192" font-size="30" fill="#193b42" font-weight="700" text-anchor="middle">f ≈ p</text><text x="557" y="212" font-size="12.5" fill="#607570" text-anchor="middle">用容易计算的 p 代替难处理的 f</text><path d="M734 186 L776 186" stroke="#207a68" stroke-width="2.5"/><path d="M776 186 L766 181.5 L766 190.5 Z" fill="#207a68"/><text x="800" y="180" font-size="19" fill="#193b42" font-weight="650" text-anchor="start">唯一要回答的问题</text><text x="800" y="204" font-size="15" fill="#b4623c" font-weight="600" text-anchor="start">f − p 到底有多大？</text><path d="M720 232 L720 252" stroke="#c9d6d2" stroke-width="2.5"/><line x1="174" y1="252" x2="1267" y2="252" stroke="#c9d6d2" stroke-width="2.5"/><line x1="174" y1="252" x2="174" y2="270" stroke="#c9d6d2" stroke-width="2.5"/><line x1="447" y1="252" x2="447" y2="270" stroke="#c9d6d2" stroke-width="2.5"/><line x1="720" y1="252" x2="720" y2="270" stroke="#c9d6d2" stroke-width="2.5"/><line x1="993" y1="252" x2="993" y2="270" stroke="#c9d6d2" stroke-width="2.5"/><line x1="1266" y1="252" x2="1266" y2="270" stroke="#c9d6d2" stroke-width="2.5"/><rect x="46" y="270" width="257" height="210" rx="10" fill="#fffdf7" stroke="#dbe5e2" stroke-width="2"/><text x="174" y="304" font-size="17" fill="#193b42" font-weight="700" text-anchor="middle">2.1 · 插值</text><line x1="62" y1="318" x2="287" y2="318" stroke="#e6ede9" stroke-width="1.5"/><text x="174" y="344" font-size="13" fill="#4a5f5b" text-anchor="middle">定 p：精确穿过每个点</text><rect x="70" y="356" width="208" height="34" rx="8" fill="#f2f6f3"/><text x="174" y="379" font-size="15" fill="#193b42" font-weight="600" text-anchor="middle">p(x_i) = f(x_i)</text><text x="174" y="416" font-size="13" fill="#4a5f5b" text-anchor="middle">用途：任意点上的函数值</text><text x="174" y="446" font-size="12.5" fill="#207a68" font-weight="600" text-anchor="middle">误差：导数因子 × 节点因子</text><text x="174" y="466" font-size="12" fill="#607570" text-anchor="middle">次数越高不等于越准</text><rect x="319" y="270" width="257" height="210" rx="10" fill="#fffdf7" stroke="#dbe5e2" stroke-width="2"/><text x="447" y="304" font-size="17" fill="#193b42" font-weight="700" text-anchor="middle">2.2 · 逼近</text><line x1="335" y1="318" x2="560" y2="318" stroke="#e6ede9" stroke-width="1.5"/><text x="447" y="344" font-size="13" fill="#4a5f5b" text-anchor="middle">定 p：让残差平方和最小</text><rect x="343" y="356" width="208" height="34" rx="8" fill="#f2f6f3"/><text x="447" y="379" font-size="15" fill="#193b42" font-weight="600" text-anchor="middle">min Σ (f − p)²</text><text x="447" y="416" font-size="13" fill="#4a5f5b" text-anchor="middle">用途：从噪声数据提趋势</text><text x="447" y="446" font-size="12.5" fill="#207a68" font-weight="600" text-anchor="middle">误差：残差水位 + 条件数</text><text x="447" y="466" font-size="12" fill="#607570" text-anchor="middle">换基不改变解，只改变算法</text><rect x="592" y="270" width="257" height="210" rx="10" fill="#fffdf7" stroke="#dbe5e2" stroke-width="2"/><text x="720" y="304" font-size="17" fill="#193b42" font-weight="700" text-anchor="middle">2.3 · 插值积分</text><line x1="608" y1="318" x2="833" y2="318" stroke="#e6ede9" stroke-width="1.5"/><text x="720" y="344" font-size="13" fill="#4a5f5b" text-anchor="middle">定 p：用分段直线代替曲线</text><rect x="616" y="356" width="208" height="34" rx="8" fill="#f2f6f3"/><text x="720" y="379" font-size="15" fill="#193b42" font-weight="600" text-anchor="middle">∫ p ≈ ∫ f</text><text x="720" y="416" font-size="13" fill="#4a5f5b" text-anchor="middle">用途：算面积、算总量</text><text x="720" y="446" font-size="12.5" fill="#207a68" font-weight="600" text-anchor="middle">误差：被平均，降一阶</text><text x="720" y="466" font-size="12" fill="#607570" text-anchor="middle">把区间对折，误差降到 1/4</text><rect x="865" y="270" width="257" height="210" rx="10" fill="#fffdf7" stroke="#dbe5e2" stroke-width="2"/><text x="993" y="304" font-size="17" fill="#193b42" font-weight="700" text-anchor="middle">2.4 · 插值微分</text><line x1="881" y1="318" x2="1106" y2="318" stroke="#e6ede9" stroke-width="1.5"/><text x="993" y="344" font-size="13" fill="#4a5f5b" text-anchor="middle">定 p：用差商代替导数</text><rect x="889" y="356" width="208" height="34" rx="8" fill="#f2f6f3"/><text x="993" y="379" font-size="15" fill="#193b42" font-weight="600" text-anchor="middle">p′ ≈ f′</text><text x="993" y="416" font-size="13" fill="#4a5f5b" text-anchor="middle">用途：算斜率、算灵敏度</text><text x="993" y="446" font-size="12.5" fill="#b4623c" font-weight="600" text-anchor="middle">误差：被放大，升一阶</text><text x="993" y="466" font-size="12" fill="#607570" text-anchor="middle">步长太小反而更糟</text><rect x="1138" y="270" width="258" height="210" rx="10" fill="#fffdf7" stroke="#dbe5e2" stroke-width="2"/><text x="1267" y="304" font-size="17" fill="#193b42" font-weight="700" text-anchor="middle">2.5 · 网络逼近与求导</text><line x1="1154" y1="318" x2="1380" y2="318" stroke="#e6ede9" stroke-width="1.5"/><text x="1267" y="344" font-size="13" fill="#4a5f5b" text-anchor="middle">定 p：基函数本身带参数</text><rect x="1162" y="356" width="208" height="34" rx="8" fill="#f2f6f3"/><text x="1267" y="379" font-size="15" fill="#193b42" font-weight="600" text-anchor="middle">p = Σ a·φ(w)</text><text x="1267" y="416" font-size="13" fill="#4a5f5b" text-anchor="middle">用途：同时要值和导数</text><text x="1267" y="446" font-size="12.5" fill="#207a68" font-weight="600" text-anchor="middle">误差：无闭式，只能实测</text><text x="1267" y="466" font-size="12" fill="#607570" text-anchor="middle">值准了，导数不一定准</text><text x="46" y="514" font-size="14" fill="#193b42" font-weight="700" text-anchor="start">第三、四站是一对反向操作</text><rect x="46" y="526" width="640" height="90" rx="10" fill="#eef4ef" stroke="#dbe5e2" stroke-width="2"/><text x="72" y="558" font-size="16" fill="#193b42" font-weight="650" text-anchor="start">积分把振荡平均掉一层</text><text x="72" y="592" font-size="13.5" fill="#4a5f5b" text-anchor="start">每一小块的正负偏差互相抵消，总误差比函数值误差低一阶。</text><text x="710" y="580" font-size="26" fill="#207a68" font-weight="700" text-anchor="middle">⇄</text><rect x="756" y="526" width="642" height="90" rx="10" fill="#fdf1e9" stroke="#e8cdbb" stroke-width="2"/><text x="782" y="558" font-size="16" fill="#b4623c" font-weight="650" text-anchor="start">微分把振荡放大一层</text><text x="782" y="592" font-size="13.5" fill="#4a5f5b" text-anchor="start">相邻两点的偏差要除以很小的步长，总误差比函数值误差高一阶。</text></svg>
