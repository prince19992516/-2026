<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="ttl dsc"><title id="ttl">从插值公式到等距失效的时间线</title><desc id="dsc">按提出年代排列的五个路标：1785年勒让德的正交多项式，1795年拉格朗日的插值公式，1854年切比雪夫的一致逼近，1885年魏尔斯特拉斯的万能逼近定理，1901年龙格的等距插值反例。概念示意，不是实测结果。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC","PingFang SC",sans-serif;font-variant-numeric:tabular-nums}</style><rect x="0" y="0" width="1440" height="560" fill="#faf7ef"/><rect x="36" y="28" width="94" height="34" rx="17" fill="#193b42"/><text x="83" y="52" font-size="17" fill="#ffffff" font-weight="650" text-anchor="middle">CH 02</text><text x="149" y="54" font-size="24" fill="#193b42" font-weight="650" text-anchor="start">逼近的智慧</text><text x="38" y="112" font-size="34" fill="#193b42" font-weight="700" text-anchor="start">一条主线的五个路标</text><text x="1400" y="112" font-size="18" fill="#607570" font-weight="500" text-anchor="end">按提出年代排列 · 不是人物肖像</text><line x1="80" y1="332" x2="1360" y2="332" stroke="#c9d6d2" stroke-width="3"/><circle cx="160" cy="332" r="9" fill="#207a68"/><circle cx="160" cy="332" r="4" fill="#faf7ef"/><rect x="44" y="150" width="232" height="130" rx="10" fill="#fffdf7" stroke="#dbe5e2" stroke-width="2"/><text x="160" y="184" font-size="21" fill="#193b42" font-weight="700" text-anchor="middle">勒让德</text><text x="160" y="208" font-size="13" fill="#607570" text-anchor="middle">1752—1833</text><text x="160" y="238" font-size="15" fill="#207a68" font-weight="650" text-anchor="middle">正交多项式</text><text x="160" y="264" font-size="13" fill="#4a5f5b" text-anchor="middle">基函数彼此“垂直”，系数可逐个算</text><text x="160" y="376" font-size="21" fill="#207a68" font-weight="700" text-anchor="middle">1785</text><text x="160" y="402" font-size="13" fill="#607570" text-anchor="middle">见附录 A</text><circle cx="440" cy="332" r="9" fill="#207a68"/><circle cx="440" cy="332" r="4" fill="#faf7ef"/><rect x="324" y="150" width="232" height="130" rx="10" fill="#fffdf7" stroke="#dbe5e2" stroke-width="2"/><text x="440" y="184" font-size="21" fill="#193b42" font-weight="700" text-anchor="middle">拉格朗日</text><text x="440" y="208" font-size="13" fill="#607570" text-anchor="middle">1736—1813</text><text x="440" y="238" font-size="15" fill="#207a68" font-weight="650" text-anchor="middle">插值公式</text><text x="440" y="264" font-size="13" fill="#4a5f5b" text-anchor="middle">把“过点”写成一个统一的和式</text><text x="440" y="376" font-size="21" fill="#207a68" font-weight="700" text-anchor="middle">1795</text><text x="440" y="402" font-size="13" fill="#607570" text-anchor="middle">第 2.1 节</text><circle cx="720" cy="332" r="9" fill="#207a68"/><circle cx="720" cy="332" r="4" fill="#faf7ef"/><rect x="604" y="150" width="232" height="130" rx="10" fill="#fffdf7" stroke="#dbe5e2" stroke-width="2"/><text x="720" y="184" font-size="21" fill="#193b42" font-weight="700" text-anchor="middle">切比雪夫</text><text x="720" y="208" font-size="13" fill="#607570" text-anchor="middle">1821—1894</text><text x="720" y="238" font-size="15" fill="#207a68" font-weight="650" text-anchor="middle">一致逼近</text><text x="720" y="264" font-size="13" fill="#4a5f5b" text-anchor="middle">点往两端放，最大误差最小</text><text x="720" y="376" font-size="21" fill="#207a68" font-weight="700" text-anchor="middle">1854</text><text x="720" y="402" font-size="13" fill="#607570" text-anchor="middle">第 2.1 节（扩展）</text><circle cx="1000" cy="332" r="9" fill="#207a68"/><circle cx="1000" cy="332" r="4" fill="#faf7ef"/><rect x="884" y="150" width="232" height="130" rx="10" fill="#fffdf7" stroke="#dbe5e2" stroke-width="2"/><text x="1000" y="184" font-size="21" fill="#193b42" font-weight="700" text-anchor="middle">魏尔斯特拉斯</text><text x="1000" y="208" font-size="13" fill="#607570" text-anchor="middle">1815—1897</text><text x="1000" y="238" font-size="15" fill="#207a68" font-weight="650" text-anchor="middle">万能逼近</text><text x="1000" y="264" font-size="13" fill="#4a5f5b" text-anchor="middle">连续函数都能被多项式逼近</text><text x="1000" y="376" font-size="21" fill="#207a68" font-weight="700" text-anchor="middle">1885</text><text x="1000" y="402" font-size="13" fill="#607570" text-anchor="middle">第 2.5 节</text><circle cx="1280" cy="332" r="9" fill="#b4623c"/><circle cx="1280" cy="332" r="4" fill="#faf7ef"/><rect x="1164" y="150" width="232" height="130" rx="10" fill="#fffdf7" stroke="#dbe5e2" stroke-width="2"/><text x="1280" y="184" font-size="21" fill="#193b42" font-weight="700" text-anchor="middle">龙格</text><text x="1280" y="208" font-size="13" fill="#607570" text-anchor="middle">1856—1927</text><text x="1280" y="238" font-size="15" fill="#b4623c" font-weight="650" text-anchor="middle">等距插值失效</text><text x="1280" y="264" font-size="13" fill="#4a5f5b" text-anchor="middle">点放错位置，次数越高越糟</text><text x="1280" y="376" font-size="21" fill="#b4623c" font-weight="700" text-anchor="middle">1901</text><text x="1280" y="402" font-size="13" fill="#607570" text-anchor="middle">第 2.1 节</text><rect x="44" y="436" width="1352" height="96" rx="8" fill="#eef4ef" stroke="#dbe5e2" stroke-width="1"/><text x="72" y="466" font-size="16" fill="#193b42" font-weight="650" text-anchor="start">两句话并不矛盾，问的不是同一件事</text><text x="72" y="492" font-size="15" fill="#3f5551" text-anchor="start">魏尔斯特拉斯回答“存在不存在”：总能找到一个多项式足够接近目标。</text><text x="72" y="516" font-size="15" fill="#3f5551" text-anchor="start">龙格回答“随便放点行不行”：等距取点时，次数越高反而越糟。本章把这两件事分开说清楚。</text></svg>
