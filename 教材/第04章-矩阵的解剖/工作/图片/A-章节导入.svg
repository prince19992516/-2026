<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="660" viewBox="0 0 1440 660" role="img" aria-labelledby="title desc"><title id="title">矩阵的解剖：给矩阵做一次体检</title><desc id="desc">矩阵的解剖导入：给矩阵做一次体检。看清内部结构；追踪扰动的传播；警惕“漂亮的残差”。概念示意，具体条件和公式见正文。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC","PingFang SC",sans-serif} text{font-variant-numeric:tabular-nums}</style><rect x="0" y="0" width="1440" height="660" rx="0" fill="#faf7ef" stroke="none" stroke-width="2"/><rect x="36" y="28" width="94" height="34" rx="17" fill="#193b42" stroke="none" stroke-width="2"/><text x="83" y="52" font-size="17" fill="white" font-weight="650" text-anchor="middle">CH 04</text><text x="149" y="54" font-size="24" fill="#193b42" font-weight="650" text-anchor="start">矩阵的解剖</text><text x="38" y="112" font-size="37" fill="#193b42" font-weight="700" text-anchor="start">给矩阵做一次体检</text><text x="1400" y="53" font-size="19" fill="#607570" font-weight="500" text-anchor="end">一幅图 · 一个问题</text><rect x="36" y="149" width="440" height="442" rx="20" fill="white" stroke="#193b42" stroke-width="2"/><circle cx="67" cy="182" r="14" fill="#207a68" stroke="#207a68" stroke-width="2"/><text x="67" y="188" font-size="17" fill="white" font-weight="650" text-anchor="middle">1</text><text x="94" y="190" font-size="23" fill="#193b42" font-weight="650" text-anchor="start">看清内部结构</text><g transform="translate(70,178)"><rect x="47" y="115" width="269" height="155" rx="20" fill="white" stroke="#193b42" stroke-width="3"/><text x="72" y="149" font-size="26" fill="#193b42" font-weight="650" text-anchor="start">矩阵体检单</text><text x="79" y="207" font-size="24" fill="#207a68" font-weight="600" text-anchor="start">A = diag(1, 10<tspan baseline-shift="super" font-size="17">−10</tspan>)</text><circle cx="280" cy="265" r="36" fill="none" stroke="#d26a3d" stroke-width="6"/><line x1="306" y1="294" x2="330" y2="324" stroke="#d26a3d" stroke-width="9" stroke-linecap="round" stroke-dasharray=""/><text x="41" y="367" font-size="23" fill="#607570" font-weight="400" text-anchor="start">哪一个方向最敏感？</text></g><rect x="500" y="149" width="440" height="442" rx="20" fill="white" stroke="#193b42" stroke-width="2"/><circle cx="531" cy="182" r="14" fill="#207a68" stroke="#207a68" stroke-width="2"/><text x="531" y="188" font-size="17" fill="white" font-weight="650" text-anchor="middle">2</text><text x="558" y="190" font-size="23" fill="#193b42" font-weight="650" text-anchor="start">追踪扰动的传播</text><g transform="translate(534,178)"><rect x="30" y="105" width="315" height="100" rx="16" fill="#d8eee6" stroke="none" stroke-width="2"/><text x="48" y="136" font-size="19" fill="#607570" font-weight="400" text-anchor="start">输入：很小的扰动</text><text x="48" y="179" font-size="31" fill="#193b42" font-weight="650" text-anchor="start">Δb₂ = 10<tspan baseline-shift="super" font-size="17">−10</tspan></text><line x1="184" y1="223" x2="184" y2="259" stroke="#d26a3d" stroke-width="4" stroke-linecap="round" stroke-dasharray=""/><path d="M 174.00,248.00 L 184.00,259.00 L 194.00,248.00" fill="none" stroke="#d26a3d" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray=""/><rect x="30" y="277" width="315" height="100" rx="16" fill="#f8e2d2" stroke="none" stroke-width="2"/><text x="48" y="308" font-size="19" fill="#607570" font-weight="400" text-anchor="start">输出：解发生明显变化</text><text x="48" y="351" font-size="31" fill="#193b42" font-weight="650" text-anchor="start">Δx₂ = 1</text></g><rect x="964" y="149" width="440" height="442" rx="20" fill="white" stroke="#193b42" stroke-width="2"/><circle cx="995" cy="182" r="14" fill="#207a68" stroke="#207a68" stroke-width="2"/><text x="995" y="188" font-size="17" fill="white" font-weight="650" text-anchor="middle">3</text><text x="1022" y="190" font-size="23" fill="#193b42" font-weight="650" text-anchor="start">警惕“漂亮的残差”</text><g transform="translate(998,178)"><g transform="translate(40,206) scale(1)"><rect x="0" y="0" width="82" height="62" rx="18" fill="#d8eee6" stroke="#193b42" stroke-width="3"/><line x1="41" y1="-14" x2="41" y2="0" stroke="#193b42" stroke-width="3" stroke-linecap="round" stroke-dasharray=""/><circle cx="41" cy="-20" r="6" fill="#f8e2d2" stroke="#193b42" stroke-width="2"/><circle cx="23" cy="25" r="5" fill="#193b42" stroke="#193b42" stroke-width="2"/><circle cx="58" cy="25" r="5" fill="#193b42" stroke="#193b42" stroke-width="2"/><line x1="30" y1="45" x2="50" y2="45" stroke="#193b42" stroke-width="3" stroke-linecap="round" stroke-dasharray=""/><rect x="16" y="67" width="50" height="45" rx="10" fill="white" stroke="#193b42" stroke-width="3"/><line x1="16" y1="79" x2="-4" y2="91" stroke="#193b42" stroke-width="3" stroke-linecap="round" stroke-dasharray=""/><line x1="66" y1="79" x2="87" y2="65" stroke="#193b42" stroke-width="3" stroke-linecap="round" stroke-dasharray=""/><line x1="27" y1="112" x2="22" y2="132" stroke="#193b42" stroke-width="3" stroke-linecap="round" stroke-dasharray=""/><line x1="54" y1="112" x2="61" y2="132" stroke="#193b42" stroke-width="3" stroke-linecap="round" stroke-dasharray=""/></g><rect x="152" y="110" width="192" height="92" rx="17" fill="white" stroke="#193b42" stroke-width="2"/><path d="M 182 201 l 0 14 l 17 -14" fill="white" stroke="#193b42" stroke-width="2"/><text x="170" y="142" font-size="21" fill="#193b42" font-weight="400" text-anchor="start">残差很小，</text><text x="170" y="171" font-size="21" fill="#193b42" font-weight="400" text-anchor="start">解就一定准？</text><text x="30" y="366" font-size="23" fill="#d26a3d" font-weight="650" text-anchor="start">残差与解误差，要分开看</text></g><text x="39" y="631" font-size="18" fill="#607570" font-weight="400" text-anchor="start">概念示意 / 图中的比喻用于提问，科学结论由正文中的假设、推导与实验支撑。</text><text x="1401" y="631" font-size="18" fill="#607570" font-weight="500" text-anchor="end">2026 · 科学计算</text></svg>