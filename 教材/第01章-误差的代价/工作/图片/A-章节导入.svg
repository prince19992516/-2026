<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="660" viewBox="0 0 1440 660" role="img" aria-labelledby="title desc"><title id="title">误差的代价：差额去哪儿了？</title><desc id="desc">误差的代价导入：差额去哪儿了？。看似简单的相减；计算器给了个意外；换个写法，再问一次。概念示意，具体条件和公式见正文。</desc><style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC","PingFang SC",sans-serif} text{font-variant-numeric:tabular-nums}</style><rect x="0" y="0" width="1440" height="660" rx="0" fill="#faf7ef" stroke="none" stroke-width="2"/><rect x="36" y="28" width="94" height="34" rx="17" fill="#193b42" stroke="none" stroke-width="2"/><text x="83" y="52" font-size="17" fill="white" font-weight="650" text-anchor="middle">CH 01</text><text x="149" y="54" font-size="24" fill="#193b42" font-weight="650" text-anchor="start">误差的代价</text><text x="38" y="112" font-size="37" fill="#193b42" font-weight="700" text-anchor="start">差额去哪儿了？</text><text x="1400" y="53" font-size="19" fill="#607570" font-weight="500" text-anchor="end">一幅图 · 一个问题</text><rect x="36" y="149" width="440" height="442" rx="20" fill="white" stroke="#193b42" stroke-width="2"/><circle cx="67" cy="182" r="14" fill="#207a68" stroke="#207a68" stroke-width="2"/><text x="67" y="188" font-size="17" fill="white" font-weight="650" text-anchor="middle">1</text><text x="94" y="190" font-size="23" fill="#193b42" font-weight="650" text-anchor="start">看似简单的相减</text><g transform="translate(70,178)"><rect x="30" y="98" width="315" height="100" rx="16" fill="#d8eee6" stroke="none" stroke-width="2"/><text x="48" y="129" font-size="19" fill="#607570" font-weight="400" text-anchor="start">两笔几乎一样大的数</text><text x="48" y="172" font-size="31" fill="#193b42" font-weight="650" text-anchor="start">√(x + 1)   与   √x</text><g transform="translate(55,245) scale(0.82)"><rect x="0" y="0" width="82" height="62" rx="18" fill="#d8eee6" stroke="#193b42" stroke-width="3"/><line x1="41" y1="-14" x2="41" y2="0" stroke="#193b42" stroke-width="3" stroke-linecap="round" stroke-dasharray=""/><circle cx="41" cy="-20" r="6" fill="#f8e2d2" stroke="#193b42" stroke-width="2"/><circle cx="23" cy="25" r="5" fill="#193b42" stroke="#193b42" stroke-width="2"/><circle cx="58" cy="25" r="5" fill="#193b42" stroke="#193b42" stroke-width="2"/><line x1="30" y1="45" x2="50" y2="45" stroke="#193b42" stroke-width="3" stroke-linecap="round" stroke-dasharray=""/><rect x="16" y="67" width="50" height="45" rx="10" fill="white" stroke="#193b42" stroke-width="3"/><line x1="16" y1="79" x2="-4" y2="91" stroke="#193b42" stroke-width="3" stroke-linecap="round" stroke-dasharray=""/><line x1="66" y1="79" x2="87" y2="65" stroke="#193b42" stroke-width="3" stroke-linecap="round" stroke-dasharray=""/><line x1="27" y1="112" x2="22" y2="132" stroke="#193b42" stroke-width="3" stroke-linecap="round" stroke-dasharray=""/><line x1="54" y1="112" x2="61" y2="132" stroke="#193b42" stroke-width="3" stroke-linecap="round" stroke-dasharray=""/></g><rect x="153" y="236" width="196" height="92" rx="17" fill="white" stroke="#193b42" stroke-width="2"/><path d="M 183 327 l 0 14 l 17 -14" fill="white" stroke="#193b42" stroke-width="2"/><text x="171" y="268" font-size="21" fill="#193b42" font-weight="400" text-anchor="start">只差一点点，</text><text x="171" y="297" font-size="21" fill="#193b42" font-weight="400" text-anchor="start">减一下就知道？</text></g><rect x="500" y="149" width="440" height="442" rx="20" fill="white" stroke="#193b42" stroke-width="2"/><circle cx="531" cy="182" r="14" fill="#207a68" stroke="#207a68" stroke-width="2"/><text x="531" y="188" font-size="17" fill="white" font-weight="650" text-anchor="middle">2</text><text x="558" y="190" font-size="23" fill="#193b42" font-weight="650" text-anchor="start">计算器给了个意外</text><g transform="translate(534,178)"><rect x="69" y="100" width="221" height="205" rx="24" fill="#d8eee6" stroke="#193b42" stroke-width="3"/><rect x="88" y="122" width="182" height="74" rx="9" fill="#193b42" stroke="#193b42" stroke-width="2"/><text x="176" y="177" font-size="43" fill="white" font-weight="65