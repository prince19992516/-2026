 Q 41 53 53 42" fill="none" stroke="#193b42" stroke-width="3"/><rect x="16" y="67" width="50" height="45" rx="10" fill="white" stroke="#193b42" stroke-width="3"/><line x1="16" y1="79" x2="-4" y2="91" stroke="#193b42" stroke-width="3" stroke-linecap="round" stroke-dasharray=""/><line x1="66" y1="79" x2="87" y2="65" stroke="#193b42" stroke-width="3" stroke-linecap="round" stroke-dasharray=""/><line x1="27" y1="112" x2="22" y2="132" stroke="#193b42" stroke-width="3" stroke-linecap="round" stroke-dasharray=""/><line x1="54" y1="112" x2="61" y2="132" stroke="#193b42" stroke-width="3" stroke-linecap="round" stroke-dasharray=""/></g><rect x="150" y="236" width="202" height="92" rx="17" fill="white" stroke="#193b42" stroke-width="2"/><path d="M 180 327 l 0 14 l 17 -14" fill="white" stroke="#193b42" stroke-width="2"/><text x="168" y="268" font-size="21" fill="#193b42" font-weight="400" text-anchor="start">代数上相等，</text><text x="168" y="297" font-size="21" fill="#193b42" font-weight="400" text-anchor="start">数值上也一样？</text></g><text x="39" y="631" font-size="18" fill="#607570" font-weight="400" text-anchor="start">概念示意 / 图中的比喻用于提问，科学结论由正文中的假设、推导与实验支撑。</text><text x="1401" y="631" font-size="18" fill="#607570" font-weight="500" text-anchor="end">2026 · 科学计算</text></svg>